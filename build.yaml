---
include:
  - board: nice_nano//zmk
    shield: urchin_left nice_view_adapter nice_view_field
    # snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n -DCONFIG_NICE_VIEW_FIELD_IDLE_MS=0
    artifact-name: urchin_left

  - board: nice_nano//zmk
    shield: urchin_right nice_view_adapter nice_view_field
    cmake-args: -DCONFIG_NICE_VIEW_FIELD_IDLE_MS=0
    artifact-name: urchin_right

  - board: xiao_ble//zmk
    shield: urchin_dongle prospector_adapter
    snippet: zmk-usb-logging
    # ZMK's debug logging starves the touch input thread badly enough to drop swipes.
    cmake-args: -DCONFIG_ZMK_SLEEP=n -DCONFIG_PROSPECTOR_STATUS_SCREEN_FERRO=y -DCONFIG_PROSPECTOR_FERRO_PALETTE_MACINTOSH=y -DCONFIG_PROSPECTOR_FIXED_BRIGHTNESS=50 -DCONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n -DCONFIG_PROSPECTOR_USE_TOUCH=y -DCONFIG_ZMK_LOGGING_MINIMAL=y -DCONFIG_CDC_ACM_DTE_RATE_CALLBACK_SUPPORT=y
    artifact-name: urchin_dongle

  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: settings_reset_nin

